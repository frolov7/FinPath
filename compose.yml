services:
  postgres:
    image: postgres:17-alpine
    container_name: finpath-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finpath
      POSTGRES_USER: finpath
      POSTGRES_PASSWORD: finpath_dev_password
    ports:
      - "5432:5432"
    volumes:
      - finpath-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finpath -d finpath"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  finpath-postgres-data: